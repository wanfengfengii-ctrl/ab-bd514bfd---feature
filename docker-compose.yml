name: beamline-scheduler

services:
  api:
    build: ./backend
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    ports:
      # Host-side port configurable: API_PORT (default 8000)
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Host-side port configurable: WEB_PORT (default 8080)
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 8s
    restart: unless-stopped

  verify:
    build: ./backend
    command: ["python", "scripts/verify.py"]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
      - WEB_URL=http://web
      - WEB_STATIC_DIR=/web-static
    volumes:
      - ./web/src:/web-static:ro
    restart: "no"
